name: board

# Moves cards on the project board and answers /claim and /unclaim comments.
# The logic and an overview are in .github/scripts/board.js.

on:
  issues:
    types: [opened, labeled, assigned, unassigned, closed, reopened]
  issue_comment:
    types: [created]
  # pull_request_target (not pull_request) so pull requests from forks can update
  # the board. Safe because this workflow never checks out or runs the PR's code.
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review, closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # Ordinary comments don't need a run, only /claim and /unclaim.
    if: >-
      github.event_name != 'issue_comment' ||
      contains(github.event.comment.body, '/claim') ||
      contains(github.event.comment.body, '/unclaim')
    steps:
      # Checks out the default branch only, never the pull request's code.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const board = require('./.github/scripts/board.js');
            await board({ github, context, core });
